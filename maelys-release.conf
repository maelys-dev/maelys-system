# What this repository declares to maelys-release (docs/conventions.md of
# maelys-release). Everything else keeps the socle's defaults.

# This repository publishes without an approval step, and says so rather
# than leaving the socle to report the gap at every preflight. What guards a
# publication here is upstream of the environment: a signed annotated tag on
# main, which only the maintainer's key can create, placed on a merge commit
# whose checks have passed, and a `release` environment that accepts tags v*
# only. With a single maintainer an approver would approve their own
# deployment: a pause, not a control. Arming a reviewer later is one
# `gh api` call and this line changed to `reviewer`.
[gate]
none

[cut]
after-version sh scripts/generate-version-header.sh
