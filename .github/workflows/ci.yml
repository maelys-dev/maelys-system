name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The socle's own CI of a product: make check on the three release
  # targets, sanitizers with clang, and the drift check of the managed
  # files from the socle release.yml pins. adopt keeps the socle line current.
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@1ea525ad1c84f44d93cc767ef39660f5b2715bd1 # v0.6.1
    with:
      product: maelys-system

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cc: gcc
            cxx: g++
          - runner: ubuntu-24.04
            cc: clang
            cxx: clang++
          - runner: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - runner: ubuntu-24.04-arm
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test
        run: make clean check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Verify architecture
        run: uname -m
      - name: Install smoke test
        run: make install-check CC=${{ matrix.cc }}

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Build and test
        run: make clean check CC=clang CXX=clang++
      - name: Install smoke test
        run: make install-check CC=clang

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ASan and UBSan
        run: make asan-ubsan CC=clang CXX=clang++
      - name: TSan
        run: make tsan CC=clang CXX=clang++
      - name: Static analyzer
        run: make analyze CC=clang

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Kill every listed mutant
        run: make mutation-check CC=clang CXX=clang++

  # kqueue and the macOS branches are mutated and sanitized here; the
  # Linux jobs above never execute them.
  macos-gates:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ASan and UBSan
        run: make asan-ubsan CC=clang CXX=clang++
      - name: TSan
        run: make tsan CC=clang CXX=clang++
      - name: Kill every listed mutant
        run: make mutation-check CC=clang CXX=clang++
      - name: Static analyzer
        run: make analyze CC=clang

  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install optional comparison libraries
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libev-dev
      - name: Run informational benchmark
        run: BENCH_ITERATIONS=25000 make benchmark CC=clang
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reactor-benchmark
          path: build/release/benchmarks/results.csv

  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install RPM packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: make check dist package-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
            dist/*.rpm

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: make check dist package-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-packages-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/homebrew/*.rb
