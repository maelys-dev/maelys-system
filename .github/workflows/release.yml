name: release

# Managed by maelys-release v0.2.2 (0.2.2). Regenerate with
# scripts/adopt.sh of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@2f4124e33d4dc522af5c2b3e66979e1fec46b03e # v0.2.2
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-system

  tap-libmaelys-sys:
    needs: release
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@2f4124e33d4dc522af5c2b3e66979e1fec46b03e # v0.2.2
    permissions:
      contents: write
    with:
      product: libmaelys-sys
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
