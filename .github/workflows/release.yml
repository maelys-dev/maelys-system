name: release

# Managed by maelys-release v0.6.1 (0.6.1). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose Homebrew publication is replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'push'
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@1ea525ad1c84f44d93cc767ef39660f5b2715bd1 # v0.6.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-system
      linux_packages: build-essential dpkg-dev file rpm python3
      macos_packages: python3

  tap-libmaelys-sys:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@1ea525ad1c84f44d93cc767ef39660f5b2715bd1 # v0.6.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-sys
      tag: ${{ inputs.tag }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
