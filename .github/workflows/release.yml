name: release

# Managed by maelys-release v0.2.6 (0.2.6). Regenerate with
# scripts/adopt.sh of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose Homebrew publication is replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'push'
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@ab86288384424eaeab665f0ecf595b68a6e2f4aa # v0.2.6
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-system

  tap-libmaelys-sys:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@ab86288384424eaeab665f0ecf595b68a6e2f4aa # v0.2.6
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-sys
      tag: ${{ inputs.tag }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
