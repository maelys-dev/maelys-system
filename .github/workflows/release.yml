name: release

# Managed by maelys-release v0.64.6 (0.64.6). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@2a3a4163dc6c0b958115fa300e2c020d0fdbe7a9 # v0.64.6
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-system
      tag: ${{ inputs.tag || github.ref_name }}
      linux_packages: build-essential dpkg-dev file rpm python3
      macos_packages: python3

  tap-libmaelys-sys:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@2a3a4163dc6c0b958115fa300e2c020d0fdbe7a9 # v0.64.6
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-sys
      tag: ${{ inputs.tag || github.ref_name }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
